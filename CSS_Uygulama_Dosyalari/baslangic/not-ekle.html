<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Ekle - Not Takip</title>
</head>
<body>
    <header>
        <img src="img/logo.svg" alt="Not Takip logosu" width="64">
        <h1>Not Takip Uygulaması</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="dersler.html">Derslerim</a></li>
                <li><a href="not-ekle.html">Not Ekle</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Not Ekle</h2>
        <form id="notFormu">
            <p>
                <label for="dersAdi">Ders adı</label><br>
                <input type="text" id="dersAdi" name="dersAdi" placeholder="Örn. Veri Yapıları" required>
            </p>
            <p>
                <label for="vize">Vize notu</label><br>
                <input type="number" id="vize" name="vize" min="0" max="100" required>
            </p>
            <p>
                <label for="final">Final notu</label><br>
                <input type="number" id="final" name="final" min="0" max="100" required>
            </p>
            <p>
                <label for="tarih">Final sınav tarihi</label><br>
                <input type="date" id="tarih" name="tarih">
            </p>
            <p>
                Ders türü:
                <input type="radio" id="zorunlu" name="tur" value="zorunlu" checked>
                <label for="zorunlu">Zorunlu</label>
                <input type="radio" id="secmeli" name="tur" value="secmeli">
                <label for="secmeli">Seçmeli</label>
            </p>
            <p>
                <label for="donem">Dönem</label><br>
                <select id="donem" name="donem">
                    <option value="guz">Güz</option>
                    <option value="bahar">Bahar</option>
                    <option value="yaz">Yaz Okulu</option>
                </select>
            </p>
            <p>
                <input type="checkbox" id="tekrar" name="tekrar">
                <label for="tekrar">Bu dersi tekrar alıyorum</label>
            </p>
            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="3" cols="40"></textarea>
            </p>
            <button type="submit">Kaydet</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Not Takip &middot; BLM2537</p>
    </footer>
</body>
</html>
